{% extends 'base.html' %}

{% block content %}
  <h2>{{ action }} Contact</h2>
  <form method="POST">
    <label>Name: <input type="text" name="name" required value="{{ contact[1] if contact else '' }}"></label><br>
    <label>Phone: <input type="tel" name="phone" value="{{ contact[2] if contact else '' }}"></label><br>
    <label>Email: <input type="email" name="email" value="{{ contact[3] if contact else '' }}"></label><br>
    <label>Address: <input type="text" name="address" value="{{ contact[4] if contact else '' }}"></label><br>
    <label>Birthday: <input type="date" name="birthday" value="{{ contact[5] if contact else '' }}"></label><br>

    <button type="submit">{{ action }}</button>
  </form>
{% endblock %}
